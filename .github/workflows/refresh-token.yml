name: Threadsトークンの更新

# Threadsの長期トークンは60日で失効します。
# 失効すると復旧に手作業が必要なため、月2回まとめて更新しておきます。
#
# あわせて、実行のたびに記録をコミットします。
# 公開リポジトリは60日間活動が無いとスケジュール実行が自動で無効化され、
# そのときは赤い×も出ずに静かに止まるため、それを防ぐ目的です。
on:
  # schedule:  ← Threadsアカウント停止(2026-09-14)のため一時停止中。再開するときは下の cron と一緒にコメントを外す
    # - cron: "0 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: トークンを更新してSecretsに書き戻す
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node src/refresh-token.mjs

      - name: 稼働記録をコミット（60日無活動による自動停止を防ぐ）
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > state/last-refresh.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last-refresh.txt
          git commit -m "chore: トークン更新の記録"
          git pull --rebase
          git push
