# TYPEFULLY_SOCIAL_SET_ID を調べるための使い捨てワークフロー。
# Actionsタブから手動実行すると、接続済みアカウントのIDがログに出ます。
name: TypefullyのアカウントIDを調べる

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: アカウント一覧を取得
        env:
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
        run: node src/list-sets.mjs
